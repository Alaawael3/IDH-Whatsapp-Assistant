[project]
name = "idh-assistant"
version = "0.1.0"
description = "IDH medical/customer-service AI assistant -- production FastAPI backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "groq>=0.11.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "weaviate-client>=4.9.0",
    "FlagEmbedding>=1.3.0",
    "rank-bm25>=0.2.2",
    "mem0ai>=0.1.30",
    "qdrant-client>=1.11.0",
    "elevenlabs>=1.10.0",
    "llama-cloud>=2.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "langchain-openai>=1.4.1",
    "openai>=2.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires live Groq/Weaviate/mem0 credentials (not run by default)",
]
